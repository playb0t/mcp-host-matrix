name: Validate matrix
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate documents, projections and checksums
        run: python3 -B tools/validate.py
      - name: Run portable method and importer regression tests
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
